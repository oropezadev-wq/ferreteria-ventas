<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head('Nueva venta')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragmentos/layout :: navbar('nueva-venta')}"></nav>

<main class="container flex-grow-1">
    <h1 class="h3 mb-3">Nueva venta</h1>

    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}">Error</div>

    <form th:action="@{/ventas}" th:object="${formulario}" method="post">
        <h2 class="h5">Productos</h2>
        <p class="small text-body-secondary">Las filas sin producto se ignoran. Los precios incluyen IGV.</p>
        <div class="row g-2 mb-2" th:each="fila, i : *{filas}">
            <div class="col-8 col-md-6">
                <select class="form-select" th:field="*{filas[__${i.index}__].productoId}"
                        th:attr="aria-label='Producto ' + ${i.count}">
                    <option value="">Producto…</option>
                    <option th:each="p : ${productos}" th:value="${p.id}"
                            th:text="${p.nombre} + ' — S/ ' + ${p.precio} + ' (stock ' + ${p.stock} + ')'">Martillo</option>
                </select>
            </div>
            <div class="col-4 col-md-2">
                <input type="number" class="form-control" min="1" placeholder="Cant."
                       th:field="*{filas[__${i.index}__].cantidad}" th:attr="aria-label='Cantidad ' + ${i.count}">
            </div>
        </div>

        <h2 class="h5 mt-4">Pago</h2>
        <div class="row g-3">
            <div class="col-12 col-md-4">
                <label for="metodoPago" class="form-label">Método de pago</label>
                <select class="form-select" th:field="*{metodoPago}">
                    <option th:each="m : ${metodos}" th:value="${m}" th:text="${m}">EFECTIVO</option>
                </select>
            </div>
            <div class="col-12 col-md-8">
                <p class="small text-body-secondary mb-1">Complete solo el dato del método elegido:</p>
                <div class="row g-2">
                    <div class="col-12 col-sm-4">
                        <label for="montoRecibido" class="form-label small">Efectivo recibido (S/)</label>
                        <input type="number" class="form-control" th:field="*{montoRecibido}" step="0.10" min="0">
                    </div>
                    <div class="col-6 col-sm-4">
                        <label for="ultimosCuatro" class="form-label small">Tarjeta: últimos 4</label>
                        <input type="text" class="form-control" th:field="*{ultimosCuatro}" maxlength="4" inputmode="numeric">
                    </div>
                    <div class="col-6 col-sm-4">
                        <label for="celular" class="form-label small">Yape: celular</label>
                        <input type="text" class="form-control" th:field="*{celular}" maxlength="9" inputmode="numeric">
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary">Registrar venta</button>
            <a class="btn btn-outline-secondary" th:href="@{/ventas}">Cancelar</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragmentos/layout :: footer}"></footer>
<th:block th:replace="~{fragmentos/layout :: scripts}"></th:block>
</body>
</html>
