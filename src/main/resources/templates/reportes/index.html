<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head('Reportes')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragmentos/layout :: navbar('reportes')}" class="no-imprimir"></nav>

<main class="container flex-grow-1">
    <h1 class="h3 mb-3 no-imprimir">Reportes</h1>

    <form th:action="@{/reportes}" method="post" class="row g-3 mb-4 no-imprimir">
        <div th:if="${error}" class="col-12">
            <div class="alert alert-danger" role="alert" th:text="${error}">Error</div>
        </div>
        <div class="col-12 col-md-4">
            <label for="tipo" class="form-label">Reporte</label>
            <select class="form-select" id="tipo" name="tipo">
                <option th:each="t : ${tipos}" th:value="${t}" th:text="${t.descripcion}"
                        th:selected="${t == tipo}">Ventas del mes</option>
            </select>
        </div>
        <div class="col-6 col-md-3">
            <label for="fecha" class="form-label">Fecha</label>
            <input type="date" class="form-control" id="fecha" name="fecha" th:value="${fecha}" required aria-describedby="ayudaFecha">
            <div id="ayudaFecha" class="form-text">Diario: ese día. Mensual: todo el mes. Trimestral: el trimestre. Anual: todo el año.</div>
        </div>
        <div class="col-6 col-md-5">
            <label for="marcaAgua" class="form-label">Marca de agua (opcional)</label>
            <input type="text" class="form-control" id="marcaAgua" name="marcaAgua" th:value="${marcaAgua}"
                   maxlength="30" placeholder="CONFIDENCIAL" aria-describedby="ayudaMarca">
            <div id="ayudaMarca" class="form-text">Texto que aparece de fondo en el reporte.</div>
        </div>
        <div class="col-12 d-flex flex-wrap gap-4">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="conSello" name="conSello" value="true" th:checked="${conSello}">
                <label class="form-check-label" for="conSello">Sello de la ferretería</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="conFirma" name="conFirma" value="true" th:checked="${conFirma}">
                <label class="form-check-label" for="conFirma">Firma digital</label>
            </div>
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Generar reporte</button>
        </div>
    </form>

    <section th:if="${reporte}">
        <div class="d-flex justify-content-end mb-2 no-imprimir">
            <button type="button" class="btn btn-outline-primary" onclick="window.print()">Imprimir / guardar PDF</button>
        </div>
        <article class="reporte border rounded p-3 p-md-4" th:utext="${reporte.html}"></article>
    </section>
</main>

<footer th:replace="~{fragmentos/layout :: footer}" class="no-imprimir"></footer>
<th:block th:replace="~{fragmentos/layout :: scripts}"></th:block>
</body>
</html>
