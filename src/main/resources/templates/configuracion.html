<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head('Configuración')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragmentos/layout :: navbar('configuracion')}"></nav>

<main class="container flex-grow-1">
    <h1 class="h3 mb-3">Configuración de la tienda</h1>
    <p class="text-body-secondary small">Estos datos se usan en el menú, los tickets y los reportes. El tipo de cambio pasa a soles el costo de los productos comprados en dólares.</p>

    <div th:if="${mensaje}" class="alert alert-success alert-dismissible" role="status">
        <span th:text="${mensaje}">Configuración guardada.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}">Error</div>

    <form th:action="@{/configuracion}" method="post" class="row g-3">
        <div class="col-12 col-md-8">
            <label for="razonSocial" class="form-label">Razón social</label>
            <input type="text" class="form-control" id="razonSocial" name="razonSocial" th:value="${tienda.razonSocial}" maxlength="100" required>
        </div>
        <div class="col-12 col-md-4">
            <label for="ruc" class="form-label">RUC</label>
            <input type="text" class="form-control" id="ruc" name="ruc" th:value="${tienda.ruc}" inputmode="numeric" maxlength="11" required>
        </div>
        <div class="col-12 col-md-8">
            <label for="direccion" class="form-label">Dirección</label>
            <input type="text" class="form-control" id="direccion" name="direccion" th:value="${tienda.direccion}" maxlength="150" required>
        </div>
        <div class="col-12 col-md-4">
            <label for="telefono" class="form-label">Teléfono</label>
            <input type="text" class="form-control" id="telefono" name="telefono" th:value="${tienda.telefono}" maxlength="20">
        </div>
        <div class="col-6 col-md-4">
            <label for="igv" class="form-label">IGV (%)</label>
            <input type="number" class="form-control" id="igv" name="igv" th:value="${tienda.igv}" step="0.01" min="0" max="30" required>
        </div>
        <div class="col-6 col-md-4">
            <label for="tipoCambio" class="form-label">Tipo de cambio (S/ por US$)</label>
            <input type="number" class="form-control" id="tipoCambio" name="tipoCambio" th:value="${tienda.tipoCambio}" step="0.001" min="0.001" required>
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
    </form>
</main>

<footer th:replace="~{fragmentos/layout :: footer}"></footer>
<th:block th:replace="~{fragmentos/layout :: scripts}"></th:block>
</body>
</html>
