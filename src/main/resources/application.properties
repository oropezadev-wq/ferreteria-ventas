spring.application.name=ferreteria-ventas
server.port=8080

# Swagger UI en http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
# Solo se documentan los endpoints REST, no las pantallas Thymeleaf
springdoc.paths-to-match=/api/**

# Solo escucha en el propio equipo; para una demo desde otro dispositivo, quitar esta línea ese día
server.address=127.0.0.1
# La sesión (usada por los mensajes flash) viaja solo en cookie, nunca en la URL
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.same-site=lax
# Nunca mostrar detalles internos en las respuestas de error
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
